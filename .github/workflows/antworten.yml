name: Antworten

# Antwort-Waechter: schaut alle 2 Minuten nach Ja/Nein-Knoepfen in Telegram,
# bestaetigt sofort und startet bei "Ja" gleich den Farmbot-Lauf.
# Startsignal von cron-job.org (Job "Farmbot Antworten", alle 2 Minuten).
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: antworten
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Knoepfe pruefen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python bot/antworten.py
