name: Farmbot

on:
  # Startsignal alle 30 Minuten kommt von cron-job.org (Job "Farmbot", seit 28.10.2026),
  # weil der GitHub-Zeitplan viele Laeufe ausfallen liess (27./28.10.: 6 statt ~24 in 12 h).
  workflow_dispatch:
    inputs:
      modus:
        description: "scan, diagnose oder telegramtest"
        type: choice
        options: [scan, diagnose, telegramtest]
        default: scan

permissions:
  contents: write

concurrency:
  group: farmbot
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bot ausfuehren
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot/main.py "${{ inputs.modus || 'scan' }}"
      - name: Daten speichern
        if: always() && (inputs.modus || 'scan') == 'scan'
        run: |
          git config user.name "farmbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data bot/cache.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Keine Aenderung"; exit 0; fi
          git commit -m "Farm-Daten aktualisiert"
          git pull --rebase
          git push
